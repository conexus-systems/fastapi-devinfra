version: '3.9'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: app

  redis:
    image: redis:7

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"

  opensearch:
    image: opensearchproject/opensearch:latest
    environment:
      discovery.type: single-node
    ports:
      - "9200:9200"
